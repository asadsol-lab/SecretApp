name: Build and Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Keystore and Configs
        run: |
          if [ -f keystore/release.keystore ]; then
            cp keystore/release.keystore debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f app/google-services.json ]; then
            echo '{"project_info":{"project_number":"374231705551","project_id":"device-audit-logs","storage_bucket":""},"client":[{"client_info":{"mobilesdk_app_id":"1:374231705551:android:e846bfe4","android_client_info":{"package_name":"audit.log.khanioo"}},"oauth_client":[],"api_key":[{"current_key":""}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}]}' > app/google-services.json
          fi

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK for Release
        run: |
          mkdir -p release_apks
          find app/build/outputs/apk/debug/ -name "*.apk" -exec cp {} release_apks/DeviceAuditLog-v1.1.apk \;
          ls -la release_apks/

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: "Device Audit Log v1.1 (Build ${{ github.run_number }})"
          body: |
            ### Device Audit Log v1.1 - Release Build
            - Single Master PIN owner protection (2nd password removed).
            - Biometric / Fingerprint authentication unlock.
            - Google Sign-In with Firebase Authentication & Cloud Firestore free database sync.
            - All Call Logs, SMS records, and WhatsApp activity securely audited and synchronized.
            - Auto-lock on app exit and Back button navigation.
            - Permanent delete option (erases local device database & Cloud Firestore data).
            - Device OEM battery optimization detection (Samsung, Xiaomi, Oppo, Vivo, OnePlus).
            - 100% English interface with soft keyboard `imePadding()`.
            - Ready-to-install Android APK attached below.
          files: release_apks/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
